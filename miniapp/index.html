<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Фокус</title>
<link rel="icon" href="data:,">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    --bg: #F4F1F3; --card: #FFFFFF; --ink: #1F171C; --muted: #756A71; --line: #E4DCE0; --line-strong: #CFC3C9;
    --accent: #A3123E; --accent-ink: #FFFFFF; --accent-soft: #F7E3EA; --accent-deep: #7C0E30;
    --ok: #2F7D4F; --ok-soft: #E3F1E8; --warn: #B8760F; --warn-soft: #FBEFD9; --bad: #B3261E; --bad-soft: #F9E0DE;
    --tab-bg: #FBF9FA; --focus: #A3123E; --shadow: 0 1px 2px rgba(31,23,28,.06), 0 8px 24px rgba(31,23,28,.08);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #171215; --card: #231B20; --ink: #F3ECEF; --muted: #A3959C; --line: #372C32; --line-strong: #4B3D44;
    --accent: #E0567F; --accent-ink: #1B0A10; --accent-soft: #3B1F2A; --accent-deep: #F08AA8;
    --ok: #6FC48F; --ok-soft: #1F3A2A; --warn: #E0A84A; --warn-soft: #3D2E14; --bad: #F0837B; --bad-soft: #43201E;
    --tab-bg: #1C1519; --focus: #E0567F; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.5);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Manrope", "Segoe UI", Roboto, system-ui, sans-serif; font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; }
  :where(button, input, textarea):focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; }
  .head { display: grid; grid-template-columns: 56px 1fr 56px; align-items: center; min-height: 52px; padding: 0 6px; background: var(--card); border-bottom: 1px solid var(--line); flex: none; }
  .head .title { text-align: center; font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .head .sub { display: block; font-size: 11px; color: var(--muted); font-weight: 500; }
  .back { border: 0; background: transparent; color: var(--accent); font-weight: 600; font-size: 15px; padding: 8px 6px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 2px; visibility: hidden; }
  .back.on { visibility: visible; }
  .content { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 14px 14px 24px; }
  .tabs { flex: none; display: flex; background: var(--tab-bg); border-top: 1px solid var(--line); padding: 6px 4px calc(10px + env(safe-area-inset-bottom)); }
  .tabs button { flex: 1; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 600; color: var(--muted); padding: 4px 0; border-radius: 10px; cursor: pointer; }
  .tabs button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tabs button[aria-selected="true"] { color: var(--accent); }

  .h2 { font-size: 20px; font-weight: 800; letter-spacing: -.01em; margin: 6px 0 12px; text-wrap: balance; }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
  .eyebrow:first-child { margin-top: 2px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  .card + .card { margin-top: 10px; }
  .pad { padding: 12px 14px; }
  .list { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .cell { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 11px 14px; border: 0; background: transparent; border-bottom: 1px solid var(--line); cursor: pointer; }
  .cell:last-child { border-bottom: 0; }
  .cell.static { cursor: default; }
  .cell:not(.static):active { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .cell .lead { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-deep); font-weight: 800; font-size: 13px; }
  .cell .lead.plain { background: transparent; width: 26px; font-size: 18px; }
  .cell.nolead { grid-template-columns: 1fr auto; }
  .cell .t { font-weight: 600; font-size: 14.5px; }
  .cell .s { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  .cell .r { font-size: 13px; color: var(--muted); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .cell .r b { color: var(--ink); font-weight: 700; }
  .chev { color: var(--line-strong); margin-left: 6px; }
  .pill { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .pill.acc { background: var(--accent-soft); color: var(--accent-deep); }
  .pill.mute { background: var(--line); color: var(--muted); }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .kpi .v { font-size: 22px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .kpi .l { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .kpi.bad .v { color: var(--bad); } .kpi.warn .v { color: var(--warn); } .kpi.ok .v { color: var(--ok); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border: 0; border-radius: 12px; padding: 12px 14px; font-weight: 700; font-size: 15px; cursor: pointer; background: var(--accent); color: var(--accent-ink); }
  .btn.sec { background: var(--accent-soft); color: var(--accent-deep); }
  .btn.ghost { background: transparent; border: 1px solid var(--line-strong); color: var(--ink); }
  .btn.danger { background: var(--bad-soft); color: var(--bad); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn + .btn { margin-top: 8px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 12px; }
  .chip { border: 1px solid var(--line-strong); background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .search { width: 100%; border: 1px solid var(--line-strong); background: var(--card); color: var(--ink); border-radius: 12px; padding: 10px 12px; font: inherit; margin-bottom: 10px; }
  .money { font-variant-numeric: tabular-nums; }
  .total { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 14px; border-top: 1px solid var(--line); font-weight: 700; }
  .total .big { font-size: 20px; font-weight: 800; }
  .lesson-line { display: grid; grid-template-columns: 24px 1fr auto; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--line); align-items: center; font-size: 13.5px; }
  .lesson-line:last-child { border-bottom: 0; }
  .lesson-line .amt { font-weight: 700; font-variant-numeric: tabular-nums; }
  .lesson-line .d { color: var(--muted); font-size: 12px; }
  .lesson-line.pick { cursor: pointer; border: 0; width: 100%; background: transparent; text-align: left; border-bottom: 1px solid var(--line); }
  .mark { width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--line-strong); display: grid; place-items: center; font-size: 13px; font-weight: 800; }
  .mark.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .mark.paid { background: var(--ok-soft); border-color: var(--ok-soft); color: var(--ok); }
  .hint { color: var(--muted); font-size: 13px; }
  .empty { text-align: center; color: var(--muted); padding: 30px 12px; }
  .bill { font-size: 13.5px; }
  .bill .grp { padding: 10px 14px 6px; font-weight: 700; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; }
  .bill .grp:first-child { border-top: 0; }
  .sheet-wrap { position: fixed; inset: 0; background: rgba(15,8,11,.45); display: flex; align-items: flex-end; z-index: 5; }
  .sheet { width: 100%; background: var(--card); border-radius: 22px 22px 0 0; padding: 10px 16px calc(24px + env(safe-area-inset-bottom)); max-height: 88%; overflow-y: auto; }
  .sheet .grab { width: 40px; height: 4px; background: var(--line-strong); border-radius: 2px; margin: 0 auto 12px; }
  .sheet h3 { margin: 0 0 6px; font-size: 18px; font-weight: 800; }
  .toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 13.5px; z-index: 6; box-shadow: var(--shadow); max-width: 88%; text-align: center; }
  .skeleton { height: 14px; border-radius: 7px; background: linear-gradient(90deg, var(--line) 25%, var(--card) 50%, var(--line) 75%); background-size: 200% 100%; animation: sk 1.1s infinite; margin: 10px 0; }
  .skeleton.w60 { width: 60%; } .skeleton.tall { height: 64px; border-radius: 14px; }
  @keyframes sk { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .fade { animation: fade .16s ease-out; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .fade, .skeleton { animation: none; } }
</style>
</head>
<body>
  <div class="screen">
    <div class="head">
      <button class="back" id="back" aria-label="Назад"><span style="font-size:20px;line-height:1">‹</span> Назад</button>
      <div class="title" id="title">Фокус</div>
      <div></div>
    </div>
    <div class="content" id="content"></div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div id="overlay"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
